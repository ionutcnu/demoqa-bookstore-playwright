name: DemoQA Book Store CI
run-name: "DemoQA Book Store validation #${{ github.run_number }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Quality checks and Playwright tests
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: part-2-test-automation/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: part-2-test-automation

      - name: Install Chromium
        run: npx playwright install chromium --with-deps
        working-directory: part-2-test-automation

      - name: Check code quality
        run: npm run quality:ci
        working-directory: part-2-test-automation

      - name: Type-check
        run: npm run typecheck
        working-directory: part-2-test-automation

      - name: Run UI and API tests
        run: npm test
        working-directory: part-2-test-automation

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: demoqa-playwright-report-${{ github.run_number }}
          path: part-2-test-automation/playwright-report/
          retention-days: 14
